server:
  name: goai-verification-mcp-server
  config:
    accessToken: ""

tools:
- name: get_order_state
  description: Independently read an authorized order state.
  args:
  - name: customer_id
    type: string
    required: true
  - name: order_ref
    type: string
    required: true
  requestTemplate:
    url: "http://host.docker.internal:19090/get-order-state"
    method: POST
    headers:
    - key: Content-Type
      value: "application/json"
    argsToJsonBody: true

- name: verify_rebooking
  description: Verify a rebooking result with independent read-only checks.
  args:
  - name: customer_id
    type: string
    required: true
  - name: resolution_plan_id
    type: string
    required: true
  - name: idempotency_key
    type: string
    required: true
  requestTemplate:
    url: "http://host.docker.internal:19090/verify-rebooking"
    method: POST
    headers:
    - key: Content-Type
      value: "application/json"
    argsToJsonBody: true
