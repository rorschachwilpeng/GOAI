<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:"
    >
    <title>GOAI · 酒店服务助手</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="chat-shell" aria-label="酒店客户服务对话">
      <header class="chat-header">
        <div class="avatar" aria-hidden="true">AI</div>
        <div>
          <h1>酒店服务助手</h1>
          <p class="presence"><span class="presence-dot"></span><span id="presence">连接中</span></p>
        </div>
        <span class="service-label">24/7 在线服务</span>
      </header>

      <section id="messages" class="messages" aria-live="polite" aria-busy="true">
        <div class="empty-state" id="empty-state">
          <strong>您好，我是酒店服务助手</strong>
          <span>请告诉我您遇到的预订问题。</span>
        </div>
      </section>

      <footer class="composer-area">
        <p id="status" class="send-status" role="status"></p>
        <form id="composer" class="composer">
          <label class="visually-hidden" for="message">请输入您的问题</label>
          <textarea
            id="message"
            rows="1"
            maxlength="1000"
            required
            placeholder="请输入您的问题…"
          ></textarea>
          <button id="send-button" type="submit">发送</button>
        </form>
        <p class="privacy-note">客户端仅展示您与酒店服务助手的对话</p>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
